[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitscribe"
version = "0.1.0"
description = "AI-powered git commit history refiner"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "GitScribe contributors"},
]
keywords = ["git", "commits", "openai", "agents", "report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "openai-agents>=0.22.2",
    "GitPython>=3.1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/Wasim-Zaman/GitScribe"
Repository = "https://github.com/Wasim-Zaman/GitScribe"
Issues = "https://github.com/Wasim-Zaman/GitScribe/issues"
